name: "Publish: serverless-node-next to npm"

# Publishes the bundled CLI (packages/framework-dist) to npmjs.org as
# `serverless-node-next`. Triggered when a GitHub Release is published,
# or manually via workflow_dispatch.
#
# Requires repository secret: NPM_TOKEN
#   - An npm "Automation" (or Granular Access) token with publish rights
#     for the `serverless-node-next` package.
#   - Add via: GitHub repo > Settings > Secrets and variables > Actions > New repository secret

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish with --dry-run (no actual publish)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # enables npm provenance

jobs:
  publish:
    name: "Build and Publish"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup: Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: "Install: Dependencies"
        run: npm install --no-audit --no-fund

      - name: "Build: Bundled CLI"
        run: npm run build:dist

      - name: "Verify: CLI runs"
        run: node packages/framework-dist/dist/sf-core.js --version

      - name: "Publish: dry-run"
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        working-directory: ./packages/framework-dist
        run: npm publish --dry-run --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: "Publish: npm"
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        working-directory: ./packages/framework-dist
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
